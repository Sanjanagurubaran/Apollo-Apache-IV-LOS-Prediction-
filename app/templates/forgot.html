<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Reset Password
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body class="login-body">

    <div class="login-card">

        <h1>
            Reset Password
        </h1>

        <p>
            Change Your Existing Password
        </p>

        {% if message %}

        <p style="color:#1f6feb; margin-bottom:20px;">

            {{ message }}

        </p>

        {% endif %}

        <form action="/forgot-password"
              method="POST">

            <div class="input-group">

                <label>
                    Email
                </label>

                <input type="email"
                       name="email"
                       required>

            </div>

            <div class="input-group">

                <label>
                    Previous Password
                </label>

                <input type="password"
                       name="old_password"
                       required>

            </div>

            <div class="input-group">

                <label>
                    New Password
                </label>

                <input type="password"
                       name="new_password"
                       required>

            </div>

            <button type="submit">

                Update Password

            </button>

        </form>

        <br>

        <a href="/">

            Back To Login

        </a>

    </div>

</body>

</html>
