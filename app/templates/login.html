<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-body">

    <div class="login-card">

        <h1>ICU Admin Login</h1>

        <p>Secure Hospital Dashboard</p>

        {% if error %}

        <p style="color:red; margin-bottom:20px;">

            {{ error }}

        </p>

        {% endif %}

        <form action="/login" method="POST">

            <div class="input-group">

                <label>Email</label>

                <input type="email"
                       name="email"
                       required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input type="password"
                       name="password"
                       required>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <br>

        <a href="/register-page">

            Create Account

        </a>

        <br><br>

        <a href="/forgot-password">

            Forgot Password?

        </a>

    </div>

</body>

</html>
